# Tres servicios: db (PostgreSQL) + app (API) + tests (pytest con cobertura).
#   docker compose up --build             -> db + app (Swagger en http://localhost:8000/docs)
#   docker compose run --rm tests         -> corre las pruebas (incluidas las 10 de PostgreSQL)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/crear-bd-pruebas.sh:/docker-entrypoint-initdb.d/01-crear-bd-pruebas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      APP_PORT: 8000   # puerto interno fijo; APP_PORT del .env solo cambia el puerto publicado en el equipo
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  tests:
    build:
      context: .
      target: tests
    profiles: ["tests"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
