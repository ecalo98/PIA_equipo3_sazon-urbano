[project]
name = "sazon-urbano"
version = "1.0.0"
description = "Sazón Urbano: lógica de negocio con DDD, Specification, State Machine y API REST"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: requiere TEST_DATABASE_URL apuntando a PostgreSQL",
]

[tool.coverage.run]
source = ["src/sazon_urbano"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "@abstractmethod",
    "if __name__ == .__main__.:",
]
